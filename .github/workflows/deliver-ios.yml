# 呼び出し側: iOS / Flutter（トリプラ）— 単独実行版 v2
# 中央リポジトリの再利用ワークフローが tripla から解決できないため、ステップを直接内包する。
# v2: flutter build ipa では xcodebuild へ API キー認証を渡せず自動プロビジョニングが失敗したため、
# ビルドとアップロードはリポジトリ内の fastlane/Fastfile（中央共通版）に任せる。
name: Deliver iOS

on:
  workflow_dispatch:

jobs:
  beta:
    runs-on: macos-15
    env:
      IOS_SCHEME: Runner
      IOS_WORKSPACE: ios/Runner.xcworkspace
      IOS_APP_IDENTIFIER: jp.tripla.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Place App Store Connect API key (自動署名用)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_CONTENT_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare iOS build (Pod install とビルド番号の設定)
        run: flutter build ios --config-only --release --build-number ${{ github.run_number }}

      - name: Setup Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install fastlane (Gemfile が無い場合)
        run: |
          if [ ! -f Gemfile ]; then gem install fastlane --no-document; fi

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: fastlane ios beta

# 呼び出し側: iOS / Flutter（トリプラ）— 単独実行版
# 中央リポジトリの再利用ワークフローが tripla から解決できないため、当面はステップを直接内包する。
name: Deliver iOS

on:
  workflow_dispatch:

jobs:
  beta:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Place App Store Connect API key (自動署名用)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_CONTENT_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA（ビルド番号はCI実行番号で自動採番）
        run: flutter build ipa --release --build-number ${{ github.run_number }}

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
